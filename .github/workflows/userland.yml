name: userland

# iOS 16 arm64 programs that run on the phone (phone/*), built with Xcode's
# iOS SDK on a macOS runner and signed ad hoc. Artifact: phone-userland.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label (macos-15-intel when the arm64 queue is full)
        default: macos-15
  push:
    branches: [davinci]
    paths:
      - "phone/wifi/**"
      - "phone/tools/**"
      - "phone/audio/**"
      - "phone/adsp/**"
      - "phone/turnip/v2test.cpp"
      - "phone/turnip/NativeAdrenoABI.h"
      - ".github/workflows/userland.yml"

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}  # macos-14: "configuration not supported" since 2026-11-05; macos-15-intel when arm64 is full
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version

      - name: wland (Wi-Fi)
        run: sh phone/wifi/build.sh

      - name: adsp (audio DSP bring-up, wland's files with the DSP's numbers)
        run: |
          sh phone/adsp/build.sh
          mkdir -p phone/wifi/out && cp phone/adsp/out/adsp phone/wifi/out/

      - name: v2test (GPU ABI test, no Turnip)
        run: |
          set -e
          # IOKit's user headers are not public in the iPhoneOS SDK: take them from the macOS SDK
          inc="$RUNNER_TEMP/iokit-inc"; mkdir -p "$inc"
          cp -R "$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/IOKit.framework/Headers" "$inc/IOKit"
          mkdir -p phone/wifi/out
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -std=c++17 \
            -I "$inc" -I phone/turnip -o phone/wifi/out/v2test phone/turnip/v2test.cpp -framework IOKit
          codesign -f -s - phone/wifi/out/v2test
          file phone/wifi/out/v2test

      - name: "phone tools from ios-flame (lsreg, prefs, oslog, psx, ...)"
        run: |
          sh phone/tools/build.sh
          mkdir -p phone/wifi/out/tools && cp phone/tools/out/* phone/wifi/out/tools/
          for f in phone/tools/out/*; do nm -m "$f" | grep "weak external" | grep -v "dynamically looked up" | sed "s|^|$f: |" || true; done

      - name: "RedwoodAudio.driver (HAL plug-in: speaker, microphone, haptics)"
        run: |
          sh phone/audio/build.sh
          cp -R phone/audio/out/RedwoodAudio.driver phone/wifi/out/
          nm -m phone/audio/out/RedwoodAudio.driver/RedwoodAudio | grep "weak external" || true

      - name: Check binaries
        run: |
          file phone/wifi/out/wland
          # iOS 16 lacks newer libc symbols; a weak import would jump to 0 (ios-flame HANDOFF.md)
          if nm -m phone/wifi/out/wland | grep "weak external"; then
            echo "::warning::weak imports above may be missing on iOS 16"
          fi
          codesign -dv phone/wifi/out/wland 2>&1 | head -n 5

      - uses: actions/upload-artifact@v4
        with:
          name: phone-userland
          path: phone/wifi/out/
